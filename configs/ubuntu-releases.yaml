# Ubuntu Server ISO download information.
# Update URL and checksum together when a new Ubuntu LTS point release is published.
#
# Every release MUST carry a checksum: DownloadUbuntu refuses a release whose
# checksum is empty or malformed, discards a cached ISO that does not match, and
# deletes + refuses a freshly downloaded ISO that does not match.
#
# How the checksums below were obtained and verified (2026-09-30):
#   1. SHA256SUMS and SHA256SUMS.gpg downloaded from
#      https://releases.ubuntu.com/<codename>/ for resolute, noble, jammy, focal.
#   2. The "Ubuntu CD Image Automatic Signing Key (2012)" fetched from
#      keyserver.ubuntu.com BY FULL FINGERPRINT
#        843938DF228D22F7B3742BC0D94AA3F0EFE21092
#      (the fingerprint published at https://ubuntu.com/tutorials/how-to-verify-ubuntu).
#   3. `gpg --verify SHA256SUMS.gpg SHA256SUMS` in a throwaway container:
#      "Good signature" with VALIDSIG 843938DF228D22F7B3742BC0D94AA3F0EFE21092
#      for all four files; a one-byte-tampered copy returned BAD signature
#      (negative control).
#   4. The *-live-server-amd64.iso line copied from each verified SHA256SUMS.
#      For 26.04.1 the full ISO was also downloaded and hashed: it matched.
#
# releases.ubuntu.com may drop superseded point releases; such an ISO then lives
# under https://old-releases.ubuntu.com/releases/<version>/ with the same checksum.

releases:
  "26.04":
    url: https://releases.ubuntu.com/resolute/ubuntu-26.04.1-live-server-amd64.iso
    checksum: cc8a95cde20f6ced61a322420de00f10cc3c90ced545daa46cb9c1a117f1d927

