# AlmaLinux ISO + install-tree information (profile "alma").
# Update every field together when a new AlmaLinux point release is published.
#
# The boot ISO is only the Anaconda installer; packages are installed from the
# BaseOS/AppStream trees named below (kickstart `url` / `repo`). Pin them to the
# same minor as the ISO. When a newer minor is released the old tree moves to
# https://vault.almalinux.org/<version>/ - update the two *_url values then.
#
# Every release MUST carry a checksum: the ISO is refused if it is empty or
# malformed, a cached ISO that does not match is discarded, and a downloaded ISO
# that does not match is deleted and refused.
#
# How the checksum below was obtained and verified (2026-11-08):
#   1. CHECKSUM downloaded from https://repo.almalinux.org/almalinux/9/isos/x86_64/
#      (a PGP clear-signed file) and RPM-GPG-KEY-AlmaLinux-9 from
#      https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-9
#   2. Key fingerprint BF18 AC28 7617 8908 D6E7 1267 D36C B86C B86B 3716
#      (AlmaLinux OS 9 <packager@almalinux.org>).
#   3. `gpg --verify CHECKSUM` in a throwaway GNUPGHOME: GOODSIG + VALIDSIG for that
#      fingerprint; a one-byte-tampered copy returned BAD signature (negative control).
#   4. The AlmaLinux-9.8-x86_64-boot.iso line copied from the verified CHECKSUM; the
#      full ISO (1519271936 bytes) was also downloaded and hashed: it matched.

releases:
  "9.8":
    url: https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9.8-x86_64-boot.iso
    checksum: 445f99e24399bbe98aab86111d60751c142eda049d2444fd76da5eb03472e4ab
    baseos_url: https://repo.almalinux.org/almalinux/9.8/BaseOS/x86_64/os/
    appstream_url: https://repo.almalinux.org/almalinux/9.8/AppStream/x86_64/os/
